server {
    listen 80;
    server_name cocopi.your-school.edu.cn; # 替换为您的域名或局域网 IP

    root /var/www/cocopi-portal/dist;
    index index.html;
    client_max_body_size 32k;

    # 开启 Gzip 压缩加速静态资源与教案列表加载
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # AI 密钥由本机 Node 代理持有，浏览器不接触密钥。
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 固件包、离线安装包大文件下载缓存配置
    location /downloads/ {
        alias /var/www/cocopi-portal/downloads/;
        autoindex on;
        expires 7d;
    }
}

